<style>
:root{--bg:#121214;--card:#1E1E22;--ink:#F4F4F6;--mute:#8E8E93;--line:rgba(255,255,255,.06);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:#121214;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px 110px}
.card{background:rgba(26,26,30,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}
h1{font-weight:800;letter-spacing:-.03em;margin:0}
.big{font-size:clamp(56px,14vw,96px);line-height:1}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar.lg{height:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .5s}
.btn{padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.12)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text]{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--bg);color:var(--ink);font:inherit;outline:0}
input[type=text]:focus{border-color:rgba(255,255,255,.45)}
.profiles{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin-top:40px}
.prof{width:136px;text-align:center}.prof .av{aspect-ratio:1;display:grid;place-items:center;font-size:52px;font-weight:800;transition:border-color .2s}
.prof button.av:hover{border-color:rgba(255,255,255,.4)}
.prof .nm{margin-top:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof small{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mute);margin-top:4px}
.add .av{border:1px dashed rgba(255,255,255,.25);border-radius:16px;color:var(--mute);font-size:38px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:9}
.modal .card{padding:24px;width:100%;max-width:320px}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}.dots b{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}.dots b.on{background:var(--ink)}
.err{height:20px;text-align:center;font-size:12px;color:#f87171}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{padding:16px 0;font-size:18px;border:1px solid rgba(255,255,255,.1);border-radius:12px}.pad button.s{font-size:12px;color:var(--mute);border:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
.nav{display:flex;gap:24px}.nav button.on{color:var(--ink)}.nav button{color:var(--mute)}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.who span{width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:34px}
.sub{padding:22px;text-align:left;transition:border-color .2s}.sub:hover{border-color:rgba(255,255,255,.3)}
.sub h2{font-size:22px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 22px}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:10px}
details{padding:16px;margin-top:16px}summary{cursor:pointer}
ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:8px}
li{padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 20px}
li.full{border-color:rgba(255,255,255,.25)}li.full .cn{color:var(--mute);text-decoration:line-through}
.ch{display:flex;gap:14px;align-items:center;padding:10px 0;font-weight:700}
.tasks{display:flex;flex-wrap:wrap;gap:0 18px;padding-left:34px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:500;color:var(--mute)}.chk.on{color:var(--ink)}
.chk i{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;transition:.15s}
.chk:hover i{border-color:rgba(255,255,255,.6)}.chk.on i{background:var(--ink);border-color:var(--ink)}
.chk svg{display:none}.chk.on svg{display:block;animation:pop .18s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(30,30,34,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.1);grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{padding:16px 0;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute)}.tabs button.on{color:var(--ink)}
.mobhead{display:none}@media(max-width:640px){.nav{display:none}.mobhead{display:block}.tabs{display:grid}.prof{width:120px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#bg{position:fixed;inset:0;z-index:-2;background:url(bg/rainy-desk.jpg) center bottom/cover no-repeat}
#scrim{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,12,.3),rgba(10,10,12,.6))}
.clk{font-weight:700;font-size:14px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.focus{margin-bottom:44px}
.wrap{text-shadow:0 1px 14px rgba(0,0,0,.6)}
.bigclk{font-size:clamp(44px,10.5vw,76px)}
.flip{display:flex;align-items:flex-end;gap:.09em}
.flip .fd+.fd{margin-left:.07em}
.fd{position:relative;width:.72em;height:1.1em;perspective:340px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:none}
.fd::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:rgba(0,0,0,.65);z-index:6}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#1f1f24;border:1px solid rgba(255,255,255,.07);backface-visibility:hidden}
.fd .t,.fd .ft{top:0;border-radius:.12em .12em 0 0;transform-origin:50% 100%;background:#232328;border-bottom:0}
.fd .u,.fd .fb{bottom:0;border-radius:0 0 .12em .12em;transform-origin:50% 0;background:#1b1b1f;border-top:0}
.fd .h b{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center;font-weight:700}
.fd .t b,.fd .ft b{top:0}.fd .u b,.fd .fb b{bottom:0}
.fd .ft,.fd .fb{visibility:hidden;z-index:4}
.fd.go .ft{visibility:visible;animation:fl1 .3s ease-in forwards}
.fd.go .fb{visibility:visible;animation:fl2 .3s .3s ease-out both}
@keyframes fl1{to{transform:rotateX(-90deg)}}@keyframes fl2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.colon{font-style:normal;font-weight:700;opacity:.5;padding:0 .02em .22em;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.ap{font-size:.26em;letter-spacing:.14em;color:var(--mute);margin-left:.5em;padding-bottom:.4em;font-weight:700}
.bigclk .dt{margin-top:14px;font-size:11px;letter-spacing:.2em}
.quote{margin:18px 0 0;color:var(--mute);font-size:15px;min-height:22px;transition:opacity .5s}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:20px;z-index:21;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.panel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));padding:18px;z-index:20;max-height:70vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.chip{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:700;color:var(--mute);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(max-width:640px){.fab{bottom:calc(72px + env(safe-area-inset-bottom,0px))}.panel{bottom:calc(128px + env(safe-area-inset-bottom,0px))}}

.sig{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px;opacity:0;animation:sigIn 1.4s .4s ease forwards}
.sig::before{content:"";width:0;height:1px;background:rgba(255,255,255,.35);animation:sigLine 1.2s .6s ease forwards}
.sig span{display:inline-block;opacity:.4;animation:sigWave 5s ease-in-out infinite}
.sig .sp{width:.5em}
@keyframes sigIn{to{opacity:1}}
@keyframes sigLine{to{width:18px}}
@keyframes sigWave{0%,100%{opacity:.35;transform:translateY(0)}18%{opacity:1;transform:translateY(-1px)}36%{opacity:.35;transform:translateY(0)}}
@media(max-width:640px){.sig{bottom:calc(66px + env(safe-area-inset-bottom,0px));left:16px}}
</style></head>
<body><div id="bg"></div><div id="scrim"></div><div class="wrap" id="app"></div><div id="dock"></div><div class="sig" id="sig" aria-label="Arnav Tiwari"></div>
<script>
const NP=[['notes','Notes'],['pyqs','PYQs']],M3=[['oneshot','One Shot'],['pyqs','PYQs']];
const SUBJ=[
{id:'phy',no:'.01',name:'Physics',tasks:NP,ch:['Electric Charges and Fields','Electrostatic Potential and Capacitance','Current Electricity','Moving Charges and Magnetism','Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics and Optical Instruments','Wave Optics','Dual Nature of Radiation and Matter','Atoms','Nuclei','Semiconductor Electronics']},
{id:'chem',no:'.02',name:'Chemistry',tasks:NP,ch:['Solutions','Electrochemistry','Chemical Kinetics','The d- and f-Block Elements','Coordination Compounds','Haloalkanes and Haloarenes','Alcohols, Phenols and Ethers','Aldehydes, Ketones and Carboxylic Acids','Amines','Biomolecules']},
{id:'math',no:'.03',name:'Mathematics',tasks:M3,ch:['Relations and Functions','Inverse Trigonometric Functions','Matrices','Determinants','Continuity and Differentiability','Application of Derivatives','Integrals','Application of Integrals','Differential Equations','Vector Algebra','Three Dimensional Geometry','Linear Programming','Probability']}];
const K=(s,i,t)=>s+'_'+i+'_'+t;
function stats(s,p){let done=0,cd=0;const per={};s.tasks.forEach(t=>per[t[0]]=0);
 s.ch.forEach((_,i)=>{let all=true;s.tasks.forEach(t=>{if(p[K(s.id,i,t[0])]){done++;per[t[0]]++}else all=false});if(all)cd++});
 const total=s.ch.length*s.tasks.length;return{done,total,cd,n:s.ch.length,per,pct:Math.round(cd/s.ch.length*100)}}
function overall(p){const a=SUBJ.map(s=>stats(s,p));const done=a.reduce((x,y)=>x+y.done,0),total=a.reduce((x,y)=>x+y.total,0);
 const cd=a.reduce((x,y)=>x+y.cd,0);return{done,total,pct:Math.round(cd/37*100),cd}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('c12:'+x)))].map(b=>b.toString(16).padStart(2,'0')).join('');

// ---- storage: each signed-in viewer gets a private doc; localStorage fallback ----
let state={progress:{}},ref=null,saving=Promise.resolve(),mode='local',who='';
const firstProgress=d=>d&&d.progress?{...d.progress}:(d&&d.profiles?{...((Object.values(d.profiles)[0]||{}).progress||{})}:null);
let dirty=0,syncErr=false;
function persist(){
 try{localStorage.setItem('c12',JSON.stringify(state))}catch(e){}
 if(ref){dirty++;const snap=JSON.stringify({progress:state.progress});saving=saving.then(()=>ref.set(JSON.parse(snap))).then(()=>{syncErr=false}).catch(()=>{syncErr=true}).then(()=>{dirty--;render()})}
}
async function init(){
 try{const p=firstProgress(JSON.parse(localStorage.getItem('c12')||'null'));if(p)state.progress=p}catch(e){}
 render();
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  try{who=((await user.me()).name||'').trim()}catch(e){}
  ref=db.doc('data/users/'+id+'/tracker');mode='sync';render();
  ref.onSnapshot(s=>{if(dirty>0)return;
   if(s.exists){const p=firstProgress(s.data());if(p){state.progress=p;try{localStorage.setItem('c12',JSON.stringify(state))}catch(e){}}
    if(s.data().profiles)persist()}
   else if(Object.keys(state.progress).length)persist();
   render()},()=>{});
 }catch(e){}
}

// ---- UI ----
let view='home';
const app=document.getElementById('app');
function render(){tracker()}
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${p}%"></i></div>`;
function tracker(){
 const pr=state.progress;
 const tabs=[['home','Home'],...SUBJ.map(s=>[s.id,s.name])];
 const nm=who||'You';
 let body='';
 if(view==='home'){const o=overall(pr);
  body=`<div class="focus"><div class="bigclk" data-clock="big"></div><p class="quote" id="quote"></p></div><p class="label">Overall syllabus</p><h1 class="big" style="margin:12px 0 18px">${o.pct}<span class="mute" style="font-size:.4em">%</span></h1>${bar(o.pct,'lg')}
  <div class="row" style="font-size:14px"><span>${o.done} / ${o.total} tasks</span><b style="color:var(--ink)">${o.cd} / 37 Chapters Completed</b></div>
  <div class="cards">${SUBJ.map(s=>{const t=stats(s,pr);return `<button class="card sub" data-go="${s.id}"><div class="label">${s.no}</div><h2>${s.name}</h2>${bar(t.pct)}<div class="row"><span>${t.pct}%</span><span>${t.cd} / ${t.n} chapters</span></div></button>`}).join('')}</div>
  <p class="label" style="margin-top:40px;text-align:center">${mode==='sync'?(syncErr?'Couldn’t sync · saved on this device':'Private to your account · synced across devices'):'Saved in this browser only'}</p>`}
 else{const s=SUBJ.find(x=>x.id===view),t=stats(s,pr);
  body=`<p class="label">${s.no}</p><h1 style="font-size:clamp(32px,8vw,52px);text-transform:uppercase;margin:6px 0 22px">${s.name}</h1>
  <div style="display:flex;align-items:flex-end;gap:22px"><h1 class="big" style="font-size:64px">${t.pct}<span class="mute" style="font-size:.5em">%</span></h1><div class="mute" style="font-size:14px;padding-bottom:6px">${t.cd} / ${t.n} chapters<br>${t.done} / ${t.total} tasks</div></div>
  <div style="margin-top:16px">${bar(t.pct,'lg')}</div>
  <details class="card"><summary class="label">View subject progress</summary>${s.tasks.map(k=>{const q=Math.round(t.per[k[0]]/t.n*100);return `<div style="margin-top:16px"><div class="row" style="margin:0 0 8px;font-size:14px"><span style="color:var(--ink)">${k[1]}</span><span>${q}% · ${t.per[k[0]]}/${t.n}</span></div>${bar(q)}</div>`}).join('')}</details>
  <ul>${s.ch.map((c,i)=>{const full=s.tasks.every(k=>pr[K(s.id,i,k[0])]);return `<li class="card ${full?'full':''}"><div class="ch"><span class="label" style="width:22px">${String(i+1).padStart(2,'0')}</span><span class="cn">${c}</span></div><div class="tasks">${s.tasks.map(k=>`<button class="chk ${pr[K(s.id,i,k[0])]?'on':''}" data-k="${K(s.id,i,k[0])}" aria-pressed="${!!pr[K(s.id,i,k[0])]}"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#121214" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></i>${k[1]}</button>`).join('')}</div></li>`}).join('')}</ul>`}
 app.innerHTML=`<div class="top"><nav class="nav">${tabs.map(t=>`<button class="label ${view===t[0]?'on':''}" data-go="${t[0]}">${t[1]}</button>`).join('')}</nav>${view==='home'?'<span></span>':'<span class="clk" data-clock></span>'}<span class="who"><span>${esc(nm[0]).toUpperCase()}</span>${esc(nm)}</span></div>${body}
 <nav class="tabs">${tabs.map(t=>`<button class="${view===t[0]?'on':''}" data-go="${t[0]}">${t[1].slice(0,5)}</button>`).join('')}</nav>`;
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;scrollTo(0,0);render()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,y=scrollY,np={...state.progress};if(np[k])delete np[k];else np[k]=true;state.progress=np;persist();render();scrollTo(0,y)});
 tickClock();showQuote();
}

// ---- extras: preferences, flip clock, quotes ----
let P={h24:false,quotes:true};
try{Object.assign(P,JSON.parse(localStorage.getItem('c12prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('c12prefs',JSON.stringify(P))}catch(e){}};

const FD='<div class="fd"><div class="h t"><b></b></div><div class="h u"><b></b></div><div class="h ft"><b></b></div><div class="h fb"><b></b></div></div>';
function setDigit(d,v){const o=d.dataset.v;if(o===v)return;d.dataset.v=v;const q=c=>d.querySelector(c+' b');
 if(o===undefined){d.querySelectorAll('b').forEach(b=>b.textContent=v);return}
 q('.t').textContent=v;q('.u').textContent=o;q('.ft').textContent=o;q('.fb').textContent=v;
 d.classList.remove('go');void d.offsetWidth;d.classList.add('go');
 clearTimeout(d._t);d._t=setTimeout(()=>{q('.u').textContent=v;d.classList.remove('go')},640)}
function tickClock(){const d=new Date();let h=d.getHours(),ap='';const m=String(d.getMinutes()).padStart(2,'0');
 if(!P.h24){ap=h<12?'AM':'PM';h=h%12||12}h=String(h).padStart(2,'0');
 const date=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
 document.querySelectorAll('[data-clock]').forEach(e=>{
  if(e.dataset.clock!=='big'){e.textContent=h+':'+m+(ap?' '+ap:'');return}
  if(!e.firstChild)e.innerHTML=`<div class="flip">${FD+FD}<i class="colon">:</i>${FD+FD}<small class="ap"></small></div><div class="label dt"></div>`;
  const s=h+m;e.querySelectorAll('.fd').forEach((x,i)=>setDigit(x,s[i]));
  e.querySelector('.ap').textContent=ap;e.querySelector('.dt').textContent=date})}
setInterval(tickClock,1000);

const Q=['One chapter at a time.','Small steps, every day.','Consistency beats intensity.','Future you is watching. Be kind to them.','Focus now, rest later.','Done is better than perfect.','Revise. Practise. Repeat.','Quiet effort adds up.','Start before you feel ready.','37 chapters. One tick at a time.','Progress, not perfection.','Discipline is remembering what you want.'];
let qi=Math.floor(Math.random()*Q.length);
function showQuote(){const e=document.getElementById('quote');if(e)e.textContent=P.quotes?Q[qi]:''}
setInterval(()=>{qi=(qi+1)%Q.length;const e=document.getElementById('quote');if(!e)return;e.style.opacity=0;setTimeout(()=>{showQuote();e.style.opacity=1},500)},20000);

// floating settings panel
const dock=document.getElementById('dock');let panelOpen=false;
const chips=(items,cur,a)=>items.map(([k,n])=>`<button class="chip ${cur===k?'on':''}" data-${a}="${k}">${n}</button>`).join('');
function drawDock(){
 dock.innerHTML=(panelOpen?`<div class="card panel"><p class="label">Clock</p><div class="chips">${chips([['12','12h'],['24','24h']],P.h24?'24':'12','h')}</div>
 <p class="label">Quotes</p><div class="chips"><button class="chip ${P.quotes?'on':''}" data-q="1">${P.quotes?'On':'Off'}</button></div></div>`:'')
 +`<button class="fab" data-fab="1" aria-label="Display settings" aria-expanded="${panelOpen}">${panelOpen?'×':'✦'}</button>`}
dock.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.fab)panelOpen=!panelOpen;
 else if('h' in d){P.h24=d.h==='24';savePrefs();document.querySelectorAll('[data-clock="big"]').forEach(x=>x.innerHTML='');tickClock()}
 else if(d.q){P.quotes=!P.quotes;savePrefs();showQuote()}
 drawDock()};
drawDock();

document.getElementById('sig').innerHTML=[...'ARNAV TIWARI'].map((c,i)=>c===' '?'<span class="sp"></span>':`<span style="animation-delay:${(i*.18).toFixed(2)}s" aria-hidden="true">${c}</span>`).join('');
init();
</script></body></html>
