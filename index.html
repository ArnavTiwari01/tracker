<style>
:root{--bg:#0c0d11;--card:#171820;--ink:#F5F6F8;--mute:#9C9DAA;--line:rgba(255,255,255,.08);
--a:#F5F6F8;--a2:#B9BBC8;--ag:255,255,255;
--blue:#6EA8FF;--teal:#38D9A9;--violet:#B794F6;--ease:cubic-bezier(.22,.8,.3,1);
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
.a-phy{--a:#6EA8FF;--a2:#3C78F0;--ag:110,168,255}
.a-chem{--a:#38D9A9;--a2:#12A67F;--ag:56,217,169}
.a-math{--a:#B794F6;--a2:#9061F9;--ag:183,148,246}
*{box-sizing:border-box}html,body{margin:0}
body{background:#0c0d11;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid rgba(var(--ag),.75);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 124px}
.card{background:linear-gradient(180deg,rgba(34,35,45,.66),rgba(20,21,28,.68));-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.09);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.55),0 28px 56px -28px rgba(0,0,0,.6);text-shadow:none}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mute{color:var(--mute)}
h1{font-weight:800;letter-spacing:-.03em;margin:0}
.big{font-size:clamp(56px,14vw,96px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.045em;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.6));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.big .pc{font-size:.4em;letter-spacing:0;margin-left:.06em;color:var(--mute);-webkit-text-fill-color:var(--mute)}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}.bar.lg{height:10px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a2),var(--a));box-shadow:0 0 14px rgba(var(--ag),.5);transition:width .8s var(--ease)}
.bar.ov i{background:linear-gradient(90deg,var(--blue),var(--teal) 55%,var(--violet))}
.btn{padding:13px 20px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.12)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text]{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--bg);color:var(--ink);font:inherit;outline:0}
input[type=text]:focus{border-color:rgba(255,255,255,.45)}
.profiles{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;margin-top:40px}
.prof{width:136px;text-align:center}.prof .av{aspect-ratio:1;display:grid;place-items:center;font-size:52px;font-weight:800;transition:border-color .2s}
.prof button.av:hover{border-color:rgba(255,255,255,.4)}
.prof .nm{margin-top:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prof small{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mute);margin-top:4px}
.add .av{border:1px dashed rgba(255,255,255,.25);border-radius:16px;color:var(--mute);font-size:38px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:9}
.modal .card{padding:24px;width:100%;max-width:320px}
.dots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}.dots b{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}.dots b.on{background:var(--ink)}
.err{height:20px;text-align:center;font-size:12px;color:#f87171}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{padding:16px 0;font-size:18px;border:1px solid rgba(255,255,255,.1);border-radius:12px}.pad button.s{font-size:12px;color:var(--mute);border:0}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:42px}
.nav{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{padding:9px 14px;border-radius:10px;color:var(--mute);transition:color .2s,background .25s,box-shadow .25s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--a);background:rgba(var(--ag),.13);box-shadow:inset 0 0 0 1px rgba(var(--ag),.28)}
.who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.who span{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,rgba(110,168,255,.28),rgba(183,148,246,.28));border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}

/* home */
.hero{position:relative;overflow:hidden;padding:26px 30px 30px}
.hero::before{content:"";position:absolute;right:-12%;top:-55%;width:75%;height:150%;background:radial-gradient(closest-side,rgba(110,168,255,.16),rgba(183,148,246,.08) 55%,transparent);pointer-events:none}
.hero>*{position:relative}
.hero-grid{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:22px 44px;margin-top:22px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.kpi b{display:flex;align-items:center;gap:6px;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:0;align-self:flex-end;padding-bottom:3px}
.kpi em{display:block;margin-top:11px;font-style:normal;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;line-height:1.4}
.flm{width:20px;height:20px;fill:currentColor;flex:none;color:var(--mute);margin-right:2px}
.kpi.live b{color:#FFC067}.kpi.live .flm{color:#FFB454;filter:drop-shadow(0 0 7px rgba(255,180,84,.6))}
.hstats{display:flex;flex-wrap:wrap;gap:16px 30px}
.hs b{display:block;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.hs b small{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:0;margin-left:5px}
.hs em{display:block;font-style:normal;margin-top:9px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* rings */
.ring{--rs:88px;position:relative;flex:none;width:var(--rs);height:var(--rs)}
.ring.xl{--rs:184px}
.ring svg{display:block;width:100%;height:100%;overflow:visible}
.ring .rt{fill:none;stroke:rgba(255,255,255,.08)}
.ring .rf{fill:none;stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease),opacity .3s;filter:drop-shadow(0 0 6px rgba(var(--ag),.55))}
.ring.ov .rf{stroke:url(#gOv);filter:drop-shadow(0 0 9px rgba(110,168,255,.45))}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rnum{font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:none}
.rnum small{font-size:.5em;color:var(--mute);margin-left:2px;letter-spacing:0;font-weight:700}
.ring.xl .rnum{font-size:58px;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.62));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.05em}
.ring.xl .rnum small{font-size:.38em;-webkit-text-fill-color:var(--mute);color:var(--mute)}

.sechead{display:flex;justify-content:space-between;align-items:baseline;margin:52px 0 14px}
.sechead .label{margin:0}
.shact{display:flex;align-items:center;gap:14px}
.pkbtn{padding:8px 15px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);font-size:12px;font-weight:700;color:var(--ink);transition:background .25s,border-color .25s,color .25s,transform .15s}
@media(hover:hover){.pkbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}}
.pkbtn:active{transform:scale(.96)}
.pkbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{margin-bottom:14px;overflow:hidden}
.picker.enter{animation:panelIn .35s var(--ease)}
.pk-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.pkclr{flex:none;font-size:12px;font-weight:700;color:var(--mute);padding:6px 10px;border-radius:9px;transition:color .2s,background .2s}
.pkclr:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.pk-body{max-height:min(58vh,480px);overflow:auto;padding:6px 20px 20px;overscroll-behavior:contain}
.pk-lbl{margin:18px 0 10px;color:var(--a)!important;font-weight:700}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.pk{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;font-size:13px;font-weight:600;color:var(--mute);transition:background .25s,border-color .25s,color .25s,transform .15s var(--ease)}
.pk i{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,255,255,.26);background:rgba(0,0,0,.22);display:grid;place-items:center;transition:background .25s,border-color .25s}
.pk i svg{display:none}.pk.on i svg{display:block}
.pk .pn{flex:none;font-size:11px;font-weight:800;color:var(--a);opacity:.85;font-variant-numeric:tabular-nums}
.pk .pt{flex:1;min-width:0;line-height:1.3}
.pk .pd{flex:none;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);opacity:.7}
@media(hover:hover){.pk:hover{background:rgba(255,255,255,.065);border-color:rgba(var(--ag),.4);color:var(--ink)}}
.pk:active{transform:scale(.97)}
.pk.on{color:var(--ink);background:rgba(var(--ag),.12);border-color:rgba(var(--ag),.42)}
.pk.on i{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent}
.pk.dn:not(.on){opacity:.55}
.fcount{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.empty{display:flex;align-items:center;gap:16px;padding:22px 24px;color:var(--mute);font-size:14px;line-height:1.55;border-style:dashed;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.02)}
.empty svg{width:26px;height:26px;flex:none;fill:none;stroke:#FFC857;stroke-width:1.8;stroke-linejoin:round;opacity:.9}
.empty span{font-size:13px;opacity:.8}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:0}
.sub{position:relative;overflow:hidden;display:block;width:100%;padding:20px 22px 22px 28px;text-align:left;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s}
.sub::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--a),var(--a2));box-shadow:0 0 16px rgba(var(--ag),.65)}
.sub::after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--ag),.17),transparent);opacity:.6;transition:opacity .35s;pointer-events:none}
.sub>*{position:relative;z-index:1}
.sub-top{display:flex;justify-content:space-between;align-items:center}
.sub-top .label{color:var(--a);font-weight:700}
.sub-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.arr{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--mute);border:1px solid var(--line);background:rgba(255,255,255,.04);transition:transform .35s var(--ease),color .25s,border-color .25s,background .25s}
.sub h2{font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 14px}
.sub .meta{padding-bottom:4px;font-size:12px;line-height:1.75;color:var(--mute);font-variant-numeric:tabular-nums}
.sub .meta b{color:var(--ink);font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute);margin-top:13px;font-variant-numeric:tabular-nums}
.row b{color:var(--ink);font-weight:700}
@media(hover:hover){
.sub:hover{transform:translateY(-4px);border-color:rgba(var(--ag),.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 22px 44px -16px rgba(var(--ag),.38),0 10px 30px rgba(0,0,0,.5)}
.sub:hover::after{opacity:1}
.sub:hover .arr{transform:translateX(3px);color:var(--a);border-color:rgba(var(--ag),.4);background:rgba(var(--ag),.12)}}
.sub:active{transform:translateY(-1px) scale(.985)}
.syncl{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:50px;text-align:center}
.syncl::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399}
.syncl.err::before{background:#f5a524;box-shadow:0 0 10px #f5a524}
.syncl.loc::before{background:var(--mute);box-shadow:none}

/* subject page */
.shead{position:relative;overflow:hidden;padding:26px 30px 28px}
.shead::before{content:"";position:absolute;right:-60px;top:-90px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--ag),.2),transparent);pointer-events:none}
.shead::after{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,var(--a),rgba(var(--ag),0))}
.shead>*{position:relative}
.chip-no{display:inline-flex;padding:5px 11px;border-radius:99px;background:rgba(var(--ag),.12);border:1px solid rgba(var(--ag),.3);color:var(--a);font-size:11px;font-weight:800;letter-spacing:.14em}
.shead h1.nm{font-size:clamp(34px,8vw,56px);text-transform:uppercase;letter-spacing:-.02em;margin:16px 0 24px;background:linear-gradient(180deg,#fff 30%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.shead-stats{display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 36px;margin-bottom:24px}
.shead .big{font-size:72px}
.shead .hstats{padding-bottom:8px}
details.dt{margin-top:14px;padding:0;overflow:hidden}
details.dt summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:17px 22px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .2s,color .2s}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary:hover{background:rgba(255,255,255,.03);color:var(--ink)}
details.dt summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translate(-2px,-2px);transition:transform .35s var(--ease),border-color .2s}
details.dt[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px);border-color:var(--a)}
.dbody{padding:2px 22px 22px;border-top:1px solid var(--line)}
.drow{margin-top:20px}
.dhead{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:10px}
.dhead span:first-child{font-weight:700}.dhead span:last-child{color:var(--mute);font-variant-numeric:tabular-nums}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.tcount{font-size:12px;color:var(--mute);font-weight:600;font-variant-numeric:tabular-nums}.tcount b{color:var(--ink);font-weight:800;font-size:14px}
.tog{display:flex;align-items:center;gap:10px;padding:7px 16px 7px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;color:var(--mute);transition:color .25s,border-color .25s,background .25s,transform .15s}
.tog:active{transform:scale(.97)}
.tog .sw{position:relative;width:36px;height:22px;border-radius:99px;background:rgba(255,255,255,.12);transition:background .3s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .35s var(--ease)}
.tog[aria-checked=true]{color:var(--ink);border-color:rgba(var(--ag),.4);background:rgba(var(--ag),.08)}
.tog[aria-checked=true] .sw{background:var(--a2)}
.tog[aria-checked=true] .sw::after{transform:translateX(14px)}
ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
ul.focl{margin-top:0}
.only li.full:not(.celebrate){display:none}
.allclear{display:none;padding:28px;text-align:center;color:var(--mute);font-size:14px;margin-top:12px}
ul.only.alldone+.allclear{display:block}
li{position:relative;padding:8px 12px 8px 22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 16px;border-color:rgba(255,255,255,.11);transition:border-color .3s,background .4s,box-shadow .3s}
li:not(.full){background:linear-gradient(180deg,rgba(41,42,53,.72),rgba(24,25,33,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.3),0 14px 30px -14px rgba(0,0,0,.7)}
li::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--a);opacity:.5;transition:opacity .35s,box-shadow .35s}
li.part::before{opacity:.95;box-shadow:0 0 12px rgba(var(--ag),.5)}
@media(hover:hover){li:hover{border-color:rgba(255,255,255,.2)}}
li.full{background:rgba(17,18,24,.5);border-color:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 2px 8px -2px rgba(0,0,0,.3);-webkit-backdrop-filter:none;backdrop-filter:none}
li.full::before{opacity:.35;box-shadow:none}
li.full .ch,li.full .tasks{opacity:.58;transition:opacity .25s}
@media(hover:hover){li.full:hover .ch,li.full:hover .tasks{opacity:1}}
li.full .cn{color:var(--mute);font-weight:600;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
li.full .cno{color:var(--mute)}
li.full .ch::after{content:"✓";order:4;flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--a);background:rgba(var(--ag),.12);margin-left:2px}
.ch{flex:1 1 250px;min-width:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 0;font-weight:700;font-size:15px;line-height:1.35}
.cn{flex:0 1 auto}
.cno{flex:none;width:24px;font-size:13px;font-weight:800;color:var(--a);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stag{flex:none;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--a)}
.wt{flex:none;padding:3px 8px;border-radius:99px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border:1px solid transparent}
.wt.h{color:#FFB454;background:rgba(255,180,84,.09);border-color:rgba(255,180,84,.24)}
.wt.l{color:var(--mute);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1)}
.wnote{font-size:10.5px;letter-spacing:.04em;text-transform:none;font-weight:500;opacity:.8}
.wnote.wn2{margin:14px 0 0;color:var(--mute);font-size:12px;line-height:1.5}
.wt.m{color:#9DB0CC;background:rgba(157,176,204,.07);border-color:rgba(157,176,204,.2)}
li.full .wt{opacity:.6}
.star{order:5;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:var(--mute);margin-left:auto;transition:color .2s,background .2s,transform .2s var(--ease)}
.star svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transition:fill .25s,transform .35s var(--ease)}
@media(hover:hover){.star:hover{color:var(--ink);background:rgba(255,255,255,.07)}}
.star.on{color:#FFC857}.star.on svg{fill:currentColor;filter:drop-shadow(0 0 6px rgba(255,200,87,.55))}
.star:active svg{transform:scale(.8)}
.star.just svg{animation:starPop .5s var(--ease)}
@keyframes starPop{0%{transform:scale(.5) rotate(-30deg)}60%{transform:scale(1.28) rotate(8deg)}100%{transform:none}}
.tasks{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 8px 36px}
.chk{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 16px 0 8px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:600;color:var(--mute);transition:background .25s,border-color .25s,color .25s,transform .18s var(--ease)}
.chk i{width:26px;height:26px;border-radius:8px;border:1.5px solid rgba(255,255,255,.26);background:rgba(0,0,0,.22);display:grid;place-items:center;transition:background .25s var(--ease),border-color .25s,box-shadow .3s}
@media(hover:hover){.chk:hover{background:rgba(255,255,255,.065);border-color:rgba(var(--ag),.4);color:var(--ink)}.chk:hover i{border-color:var(--a)}}
.chk:active{transform:scale(.94)}
.chk.on{color:var(--ink);background:rgba(var(--ag),.12);border-color:rgba(var(--ag),.4)}
.chk.on i{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;box-shadow:0 0 14px rgba(var(--ag),.5)}
.chk svg{display:none}.chk.on svg{display:block}
.chk svg path{stroke-dasharray:16;stroke-dashoffset:0}
.chk.just{animation:chkPop .5s var(--ease)}
.chk.just i{animation:boxFill .4s ease-out,ripple .65s ease-out}
.chk.just svg{animation:pop .34s var(--ease)}
.chk.just svg path{animation:draw .32s .06s ease-out both}
.chk.offp{animation:chkOff .32s var(--ease)}
.chk.offp i{animation:boxOff .3s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes draw{from{stroke-dashoffset:16}}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(var(--ag),.6)}100%{box-shadow:0 0 0 12px rgba(var(--ag),0)}}
@keyframes chkPop{0%{transform:scale(.93);background:rgba(255,255,255,.03);border-color:var(--line);color:var(--mute)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes boxFill{from{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.26)}}
@keyframes chkOff{from{transform:scale(1.05);background:rgba(var(--ag),.12);border-color:rgba(var(--ag),.4);color:var(--ink)}}
@keyframes boxOff{from{background:var(--a);border-color:transparent}}

/* chapter complete celebration */
li.celebrate{animation:celeb .85s var(--ease)}
@keyframes celeb{0%{transform:scale(1)}35%{transform:scale(1.018);box-shadow:0 0 0 1px rgba(var(--ag),.55),0 0 46px -6px rgba(var(--ag),.5)}100%{transform:scale(1)}}
li.celebrate .ch::after{animation:badgePop .6s .12s var(--ease) both}
@keyframes badgePop{from{transform:scale(0)}60%{transform:scale(1.4)}to{transform:scale(1)}}
.cfw{position:absolute;inset:0;pointer-events:none;z-index:6}
.cf{position:absolute;width:6px;height:9px;margin:-4px 0 0 -3px;border-radius:2px;opacity:0;animation:cf .95s cubic-bezier(.2,.7,.3,1) forwards}
.cf.c0{background:var(--a)}.cf.c1{background:var(--a2)}.cf.c2{background:#fff}
@keyframes cf{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}}

/* page transition (only on view change) */
.page.in{animation:pageIn .55s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}}

/* mobile tabs */
.tabs{display:none;position:fixed;bottom:0;left:0;right:0;z-index:15;background:rgba(13,14,19,.82);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -12px 32px rgba(0,0,0,.45);grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{position:relative;padding:13px 0 12px;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--mute);border-radius:12px;transition:color .25s,background .25s,transform .18s var(--ease)}
.tabs button::before{content:"";position:absolute;top:-6px;left:50%;width:0;height:3px;border-radius:0 0 4px 4px;background:var(--a);box-shadow:0 0 12px rgba(var(--ag),.85);transform:translateX(-50%);transition:width .35s var(--ease)}
.tabs button.on{color:var(--a);background:rgba(var(--ag),.1)}
.tabs button.on::before{width:26px}
.tabs button:active{transform:scale(.95)}
.mobhead{display:none}@media(max-width:640px){.nav{display:none}.mobhead{display:block}.tabs{display:grid}.prof{width:120px}
.hero{padding:22px 18px 22px}.hero-grid{grid-template-columns:1fr;justify-items:center;gap:24px;margin-top:18px}.kpis{width:100%;gap:10px}.kpi{padding:14px}.kpi b{font-size:26px}.ring.xl{--rs:156px}.ring.xl .rnum{font-size:50px}
.shead{padding:22px 20px 24px}.shead::after{left:20px;right:20px}.hstats{gap:24px}.hs b{font-size:26px}.wrap{padding-top:22px}.top{margin-bottom:32px}
.sechead{margin-top:44px}.sub{padding:18px 18px 20px 24px}.tasks{padding:2px 0 10px 36px}.toolbar{margin-top:24px}.cn{flex:1 1 150px;min-width:0}}
@media(max-width:360px){.tabs button{font-size:9.5px;letter-spacing:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#scrim{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 8% -8%,rgba(80,130,255,.15),transparent 62%),radial-gradient(800px 520px at 100% 8%,rgba(150,110,255,.13),transparent 62%),radial-gradient(760px 520px at 50% 112%,rgba(45,212,170,.09),transparent 62%),linear-gradient(180deg,rgba(9,10,14,.5),rgba(9,10,14,.78))}
.clk{font-weight:700;font-size:13px;letter-spacing:.08em;font-variant-numeric:tabular-nums;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.focus{margin-bottom:40px}
.wrap{text-shadow:0 1px 14px rgba(0,0,0,.55)}
.bigclk{font-size:clamp(40px,11vw,88px)}
.flip{display:flex;align-items:flex-end;gap:.09em}
.flip .fd+.fd{margin-left:.07em}
.fd{position:relative;width:.72em;height:1.1em;perspective:340px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:none}
.fd::before{content:"";position:absolute;inset:0;border-radius:.12em;box-shadow:0 .1em .35em rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35)}
.fd::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:rgba(0,0,0,.7);z-index:6}
.fd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#202127;border:1px solid rgba(255,255,255,.08);backface-visibility:hidden;will-change:transform}
.fd .t,.fd .ft{top:0;border-radius:.12em .12em 0 0;transform-origin:50% 100%;background:linear-gradient(180deg,#2c2d35,#24252c);border-bottom:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.fd .u,.fd .fb{bottom:0;border-radius:0 0 .12em .12em;transform-origin:50% 0;background:linear-gradient(180deg,#1b1c22,#16171c);border-top:0}
.fd .h b{position:absolute;left:0;right:0;height:200%;display:grid;place-items:center;font-weight:700}
.fd .t b,.fd .ft b{top:0}.fd .u b,.fd .fb b{bottom:0}
.fd .ft,.fd .fb{visibility:hidden;z-index:4}
.fd.go .ft{visibility:visible;animation:fl1 .3s ease-in forwards}
.fd.go .fb{visibility:visible;animation:fl2 .3s .3s ease-out both}
@keyframes fl1{to{transform:rotateX(-90deg)}}@keyframes fl2{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.colon{font-style:normal;font-weight:700;opacity:.55;padding:0 .02em .22em;animation:blink 2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.ap{font-size:.26em;letter-spacing:.14em;color:var(--mute);margin-left:.5em;padding-bottom:.4em;font-weight:700}
.bigclk .dt{margin-top:16px;font-size:11px;letter-spacing:.2em}
.quote{position:relative;margin:24px 0 0;padding:2px 0 2px 16px;max-width:38ch;color:rgba(245,246,248,.78);font-size:16px;line-height:1.5;font-weight:500;min-height:26px;transition:opacity .5s}
.quote::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--blue),var(--violet))}
.quote:empty::before{display:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:16px;background:rgba(26,27,35,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);color:var(--ink);font-size:18px;z-index:21;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 28px rgba(0,0,0,.5);transition:transform .3s var(--ease),background .25s,color .25s,border-color .25s}
@media(hover:hover){.fab:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3)}}
.fab:active{transform:scale(.94)}
.fab[aria-expanded=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));padding:20px;z-index:20;max-height:70vh;overflow:auto;border-radius:20px;border-color:rgba(255,255,255,.12)}
.panel.enter{animation:panelIn .32s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.chips{display:flex;gap:4px;width:fit-content;max-width:100%;padding:4px;margin:10px 0 20px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.panel .chips:last-child{margin-bottom:0}
.chip{padding:8px 16px;border-radius:9px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;transition:background .25s,color .25s,transform .15s}
.chip:hover{color:var(--ink)}.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.35)}
@media(max-width:640px){.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}.panel{bottom:calc(138px + env(safe-area-inset-bottom,0px))}}

.sig{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;font-size:10px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px;opacity:0;animation:sigIn 1.4s .4s ease forwards}
.sig::before{content:"";width:0;height:1px;background:rgba(255,255,255,.35);animation:sigLine 1.2s .6s ease forwards}
.sig span{display:inline-block;opacity:.4;animation:sigWave 5s ease-in-out infinite}
.sig .sp{width:.5em}
@keyframes sigIn{to{opacity:1}}
@keyframes sigLine{to{width:18px}}
@keyframes sigWave{0%,100%{opacity:.35;transform:translateY(0)}18%{opacity:1;transform:translateY(-1px)}36%{opacity:.35;transform:translateY(0)}}
@media(max-width:640px){.sig{bottom:calc(72px + env(safe-area-inset-bottom,0px));left:16px}}
</style></head>
<body><div id="bg"></div><div id="scrim"></div><div class="wrap" id="app"></div><div id="dock"></div><div class="sig" id="sig" aria-label="Arnav Tiwari"></div>
<script>
const NP=[['notes','Notes'],['pyqs','PYQs']],M3=[['oneshot','One Shot'],['pyqs','PYQs']];
const SUBJ=[
{id:'phy',no:'.01',name:'Physics',tasks:NP,ch:['Electric Charges and Fields','Electrostatic Potential and Capacitance','Current Electricity','Moving Charges and Magnetism','Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves','Ray Optics and Optical Instruments','Wave Optics','Dual Nature of Radiation and Matter','Atoms','Nuclei','Semiconductor Electronics']},
{id:'chem',no:'.02',name:'Chemistry',tasks:NP,ch:['Solutions','Electrochemistry','Chemical Kinetics','The d- and f-Block Elements','Coordination Compounds','Haloalkanes and Haloarenes','Alcohols, Phenols and Ethers','Aldehydes, Ketones and Carboxylic Acids','Amines','Biomolecules']},
{id:'math',no:'.03',name:'Mathematics',tasks:M3,ch:['Relations and Functions','Inverse Trigonometric Functions','Matrices','Determinants','Continuity and Differentiability','Application of Derivatives','Integrals','Application of Integrals','Differential Equations','Vector Algebra','Three Dimensional Geometry','Linear Programming','Probability']}];
const K=(s,i,t)=>s+'_'+i+'_'+t;
// Board-exam marks per chapter (index = chapter order below). Progress % is weighted by these.
// Physics 70 = published chapter-wise split; Chemistry 70 & Maths 80 = CBSE unit marks (chapters inside a multi-chapter unit split by estimate).
const MK={phy:[5,5,6,6,5,4,2,4,10,4,4,4,4,7],chem:[7,9,7,7,7,6,6,8,6,7],math:[4,4,5,5,8,7,10,4,6,7,7,5,8]};
const PARTIAL=true; // true: every ticked task earns its share of the chapter's marks; false: only fully completed chapters count
const fmtM=x=>Math.round(x*10)/10;
function stats(s,p){let done=0,cd=0,mk=0,mg=0;const per={},perM={};s.tasks.forEach(t=>{per[t[0]]=0;perM[t[0]]=0});
 s.ch.forEach((_,i)=>{const w=MK[s.id][i];mk+=w;let all=true,n=0;
  s.tasks.forEach(t=>{if(p[K(s.id,i,t[0])]){done++;per[t[0]]++;n++;perM[t[0]]+=w}else all=false});
  if(all)cd++;mg+=PARTIAL?w*n/s.tasks.length:(all?w:0)});
 const total=s.ch.length*s.tasks.length,perP={};s.tasks.forEach(t=>perP[t[0]]=Math.round(perM[t[0]]/mk*100));
 return{done,total,cd,n:s.ch.length,per,perP,mk,mg,pct:Math.round(mg/mk*100)}}
function overall(p){const a=SUBJ.map(s=>stats(s,p));const done=a.reduce((x,y)=>x+y.done,0),total=a.reduce((x,y)=>x+y.total,0);
 const cd=a.reduce((x,y)=>x+y.cd,0),mk=a.reduce((x,y)=>x+y.mk,0),mg=a.reduce((x,y)=>x+y.mg,0);return{done,total,pct:Math.round(mg/mk*100),cd,mk,mg}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('c12:'+x)))].map(b=>b.toString(16).padStart(2,'0')).join('');

// ---- storage: each signed-in viewer gets a private doc; localStorage fallback ----
let state={progress:{}},ref=null,saving=Promise.resolve(),mode='local',who='';
const firstProgress=d=>d&&d.progress?{...d.progress}:(d&&d.profiles?{...((Object.values(d.profiles)[0]||{}).progress||{})}:null);
let dirty=0,syncErr=false;
function persist(){
 try{localStorage.setItem('c12',JSON.stringify(state))}catch(e){}
 if(ref){dirty++;const snap=JSON.stringify({progress:state.progress});saving=saving.then(()=>ref.set(JSON.parse(snap))).then(()=>{syncErr=false}).catch(()=>{syncErr=true}).then(()=>{dirty--;render()})}
}
async function init(){
 try{const p=firstProgress(JSON.parse(localStorage.getItem('c12')||'null'));if(p)state.progress=p}catch(e){}
 render();
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  try{who=((await user.me()).name||'').trim()}catch(e){}
  ref=db.doc('data/users/'+id+'/tracker');mode='sync';render();
  ref.onSnapshot(s=>{if(dirty>0)return;
   if(s.exists){const p=firstProgress(s.data());if(p){state.progress=p;try{localStorage.setItem('c12',JSON.stringify(state))}catch(e){}}
    if(s.data().profiles)persist()}
   else if(Object.keys(state.progress).length)persist();
   render()},()=>{});
 }catch(e){}
}

// ---- UI ----
let view='home',fresh=true,justK=null,justOffK=null,justFull=null,justS=null;
const app=document.getElementById('app');
function render(){tracker()}
const LW={};
const bar=(p,c='',k='')=>`<div class="bar ${c}"><i data-bk="${k}" data-w="${p}" style="width:${LW[k]??0}%"></i></div>`;
const ring=(p,size,sw,k,cls,inner)=>{const r=(size-sw)/2,m=size/2,C=+(2*Math.PI*r).toFixed(2),w=LW[k]??0;
 return `<div class="ring ${cls}"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true">${cls.includes('ov')?'<defs><linearGradient id="gOv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EA8FF"/><stop offset=".55" stop-color="#38D9A9"/><stop offset="1" stop-color="#B794F6"/></linearGradient></defs>':''}<circle class="rt" cx="${m}" cy="${m}" r="${r}" stroke-width="${sw}"/><circle class="rf" cx="${m}" cy="${m}" r="${r}" stroke-width="${sw}" data-bk="${k}" data-w="${p}" data-c="${C}" stroke-dasharray="${C}" style="stroke-dashoffset:${C*(1-w/100)};opacity:${w>0?1:0}" transform="rotate(-90 ${m} ${m})"/></svg><div class="rc">${inner}</div></div>`};

// ---- extras (kept apart from the progress storage): focus pins, streak log, filter ----
const TARGET_DATE='2027-02-15'; // YYYY-MM-DD — change this to move the countdown
let pickOpen=false,pickFresh=false;
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const chOf=c=>{const [a,b]=String(c).split('_'),s=SUBJ.find(x=>x.id===a),i=+b;return s&&Number.isInteger(i)&&i>=0&&i<s.ch.length?[s,i]:null};
let X={focus:[],log:{},only:false};
try{const x=JSON.parse(localStorage.getItem('c12x')||'null');if(x){
 X.focus=(Array.isArray(x.focus)?x.focus:[]).filter((c,n,a)=>chOf(c)&&a.indexOf(c)===n);
 X.log=x.log&&typeof x.log==='object'?x.log:{};X.only=!!x.only}}catch(e){}
const saveX=()=>{try{localStorage.setItem('c12x',JSON.stringify(X))}catch(e){}};
function logDay(k,on){const d=ds(new Date());let a=X.log[d]||[];
 if(on){if(!a.includes(k))a.push(k)}else a=a.filter(x=>x!==k);
 if(a.length)X.log[d]=a;else delete X.log[d];
 const ks=Object.keys(X.log).sort();while(ks.length>400)delete X.log[ks.shift()];saveX()}
function streak(){const d=new Date();if(!(X.log[ds(d)]||[]).length)d.setDate(d.getDate()-1);
 let n=0;while((X.log[ds(d)]||[]).length){n++;d.setDate(d.getDate()-1)}return n}
function daysLeft(){const t=new Date(TARGET_DATE+'T00:00:00');if(isNaN(t))return null;
 return Math.max(0,Math.round((t-new Date(new Date().toDateString()))/864e5))}
const FLAME='<svg class="flm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.4 2c.5 3.6 4.9 5.6 4.9 10.3A5.3 5.3 0 0 1 12 17.6a5.3 5.3 0 0 1-5.3-5.3c0-2.1 1-3.4 2.1-4.4.1 1.4.8 2.3 1.7 2.5C10.100 7.200 11.300 4.600 12.400 2z"/></svg>';
const STAR='<svg viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z"/></svg>';
function burst(li,btn){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const lr=li.getBoundingClientRect(),br=btn.getBoundingClientRect(),x=br.left-lr.left+br.width/2,y=br.top-lr.top+br.height/2;
 const w=document.createElement('div');w.className='cfw';
 for(let n=0;n<18;n++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=36+Math.random()*78;
  p.className='cf c'+(n%3);p.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.cos(a)*d).toFixed(1)}px;--dy:${(Math.sin(a)*d-18).toFixed(1)}px;--r:${Math.round(Math.random()*540-270)}deg;animation-delay:${Math.round(Math.random()*70)}ms`;w.appendChild(p)}
 li.appendChild(w);setTimeout(()=>w.remove(),1300)}
function chLi(s,i,pr,home){
 const cid=s.id+'_'+i,ks=s.tasks.map(k=>K(s.id,i,k[0])),full=ks.every(k=>pr[k]),some=ks.some(k=>pr[k]),mk=MK[s.id][i],tr=mk>=8?'h':mk>=6?'m':'l',pin=X.focus.includes(cid);
 return `<li class="card a-${s.id} ${full?'full':some?'part':''} ${justFull===cid?'celebrate':''}"><div class="ch"><span class="cno">${String(i+1).padStart(2,'0')}</span><span class="cn">${s.ch[i]}</span>${home?`<span class="stag">${s.name}</span>`:''}<span class="wt ${tr}" title="${tr==='h'?'High':tr==='m'?'Medium':'Lower'} weightage — ${mk} board marks">${mk} marks</span><button class="star ${pin?'on':''} ${justS===cid?'just':''}" data-star="${cid}" aria-pressed="${pin}" aria-label="${pin?'Unpin from':'Pin to'} Today’s Focus">${STAR}</button></div><div class="tasks">${s.tasks.map((k,ti)=>{const key=ks[ti],on=!!pr[key];return `<button class="chk ${on?'on':''} ${on&&justK===key?'just':''} ${!on&&justOffK===key?'offp':''}" data-k="${key}" aria-pressed="${on}"><i><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0c0d11" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></i>${k[1]}</button>`}).join('')}</div></li>`}
function tracker(){
 const pr=state.progress,f=fresh;fresh=false;
 const tabs=[['home','Home'],...SUBJ.map(s=>[s.id,s.name])];
 const nm=who||'You';
 const acc=id=>id==='home'?'':'a-'+id;
 let body='';
 if(view==='home'){const o=overall(pr),sk=streak(),live=(X.log[ds(new Date())]||[]).length>0,dl=daysLeft();
  const pf=pickFresh;pickFresh=false;
  const fi=X.focus.map(chOf).filter(Boolean).sort((p,q)=>SUBJ.indexOf(p[0])-SUBJ.indexOf(q[0])||p[1]-q[1]);
  const fmt=new Date(TARGET_DATE+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  body=`<div class="focus"><div class="bigclk" data-clock="big"></div><p class="quote" id="quote"></p></div>
  <section class="hero card"><p class="label">Overall syllabus <span class="wnote">· weighted by board marks</span></p><div class="hero-grid">${ring(o.pct,184,12,'ov','xl ov',`<div class="rnum">${o.pct}<small>%</small></div>`)}
  <div class="kpis">
   <div class="kpi"><b>${o.cd}<small>/ 37</small></b><em>Chapters completed</em></div>
   <div class="kpi"><b>${fmtM(o.mg)}<small>/ ${o.mk}</small></b><em>Board marks covered</em></div>
   <div class="kpi ${live?'live':''}"><b>${FLAME}${sk}<small>${sk===1?'day':'days'}</small></b><em>${sk&&!live?'Tick a task to keep it':'Day streak'}</em></div>
   <div class="kpi"><b>${dl===null?'–':dl}<small>${dl===1?'day':'days'}</small></b><em>${dl===null?'Set a target date':dl>0?'Left · '+fmt:'Target reached'}</em></div>
  </div></div></section>
  <div class="sechead"><p class="label">Today’s Focus</p><div class="shact"><span class="fcount">${fi.length} selected</span><button class="pkbtn ${pickOpen?'on':''}" data-pktoggle aria-expanded="${pickOpen}">${pickOpen?'Done':fi.length?'Edit chapters':'Choose chapters'}</button></div></div>
  ${pickOpen?`<div class="card picker ${pf?'enter':''}"><div class="pk-head"><span>Pick the chapters you want to work on today</span>${X.focus.length?'<button class="pkclr" data-pkclear>Clear all</button>':''}</div><div class="pk-body">${SUBJ.map(s=>`<div class="pk-sub a-${s.id}"><p class="label pk-lbl">${s.name}</p><div class="pk-grid">${s.ch.map((c,i)=>{const id=s.id+'_'+i,on=X.focus.includes(id),dn=s.tasks.every(k=>pr[K(s.id,i,k[0])]);return `<button class="pk ${on?'on':''} ${dn?'dn':''}" data-pick="${id}" aria-pressed="${on}"><i><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#0c0d11" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></i><span class="pn">${String(i+1).padStart(2,'0')}</span><span class="pt">${c}</span>${dn?'<span class="pd">Done</span>':''}</button>`}).join('')}</div></div>`).join('')}</div></div>`:''}
  ${fi.length?`<ul class="focl">${fi.map(([s,i])=>chLi(s,i,pr,true)).join('')}</ul>`:pickOpen?'':`<div class="card empty">${STAR}<p style="margin:0">Choose the chapters you want to focus on today.<br><span>Use “Choose chapters” above, or tap the star beside any chapter in a subject.</span></p></div>`}
  <div class="sechead"><p class="label">Subjects</p></div>
  <div class="cards">${SUBJ.map(s=>{const t=stats(s,pr);return `<button class="card sub a-${s.id}" data-go="${s.id}"><div class="sub-top"><span class="label">${s.no}</span><span class="arr" aria-hidden="true">→</span></div><h2>${s.name}</h2><div class="sub-main"><div class="meta"><b>${t.cd}</b> / ${t.n} chapters<br><b>${fmtM(t.mg)}</b> / ${t.mk} marks</div>${ring(t.pct,88,8,'h-'+s.id,'',`<div class="rnum">${t.pct}<small>%</small></div>`)}</div></button>`}).join('')}</div>
  <p class="label syncl ${mode==='sync'?(syncErr?'err':'ok'):'loc'}">${mode==='sync'?(syncErr?'Couldn’t sync · saved on this device':'Private to your account · synced across devices'):'Saved in this browser only'}</p>`}
 else{const s=SUBJ.find(x=>x.id===view),t=stats(s,pr),left=s.ch.length-t.cd;
  body=`<section class="shead card"><span class="chip-no">${s.no}</span><h1 class="nm">${s.name}</h1>
  <div class="shead-stats"><h1 class="big">${t.pct}<span class="pc">%</span></h1><div class="hstats"><div class="hs"><b>${t.cd}<small>/ ${t.n}</small></b><em>Chapters</em></div><div class="hs"><b>${fmtM(t.mg)}<small>/ ${t.mk}</small></b><em>Marks</em></div><div class="hs"><b>${t.done}<small>/ ${t.total}</small></b><em>Tasks</em></div></div></div>${bar(t.pct,'lg','hd-'+s.id)}<p class="wnote wn2">Progress is weighted by CBSE board-exam marks, so bigger chapters move the bar more.</p></section>
  <details class="card dt"><summary class="label">View subject progress</summary><div class="dbody">${s.tasks.map(k=>{const q=t.perP[k[0]];return `<div class="drow"><div class="dhead"><span>${k[1]}</span><span>${q}% · ${t.per[k[0]]}/${t.n}</span></div>${bar(q,'','dt-'+s.id+'-'+k[0])}</div>`}).join('')}</div></details>
  <div class="toolbar"><span class="tcount"><b>${left}</b> of ${s.ch.length} chapters left</span><button class="tog" role="switch" aria-checked="${X.only}" data-only><span class="sw"></span>Show incomplete only</button></div>
  <ul class="${X.only?'only':''} ${left===0?'alldone':''}">${s.ch.map((c,i)=>chLi(s,i,pr,false)).join('')}</ul><div class="card allclear">All ${s.ch.length} chapters complete. Nicely done.</div>`}
 app.innerHTML=`<div class="top"><nav class="nav">${tabs.map(t=>`<button class="label ${acc(t[0])} ${view===t[0]?'on':''}" data-go="${t[0]}">${t[1]}</button>`).join('')}</nav>${view==='home'?'<span></span>':'<span class="clk" data-clock></span>'}<span class="who"><span>${esc(nm[0]).toUpperCase()}</span>${esc(nm)}</span></div><div class="page ${acc(view)} ${f?'in':''}">${body}</div>
 <nav class="tabs">${tabs.map(t=>`<button class="${acc(t[0])} ${view===t[0]?'on':''}" data-go="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;fresh=true;scrollTo(0,0);render()});
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,y=scrollY,np={...state.progress},[sid,ci]=k.split('_'),sj=SUBJ.find(x=>x.id===sid);
  const wasFull=sj.tasks.every(t=>np[K(sid,ci,t[0])]);
  if(np[k])delete np[k];else np[k]=true;
  const on=!!np[k],nowFull=sj.tasks.every(t=>np[K(sid,ci,t[0])]);
  state.progress=np;justK=on?k:null;justOffK=on?null:k;justFull=!wasFull&&nowFull?sid+'_'+ci:null;
  logDay(k,on);persist();render();
  if(justFull){const nb=app.querySelector(`[data-k="${k}"]`),li=nb&&nb.closest('li');if(li)burst(li,nb)}
  justK=justOffK=justFull=null;scrollTo(0,y)});
 app.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const c=b.dataset.star,ix=X.focus.indexOf(c),y=scrollY;
  if(ix>=0){X.focus.splice(ix,1);justS=null}else{X.focus.push(c);justS=c}
  saveX();render();justS=null;scrollTo(0,y)});
 app.querySelectorAll('[data-pktoggle]').forEach(b=>b.onclick=()=>{pickOpen=!pickOpen;pickFresh=pickOpen;render()});
 app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const c=b.dataset.pick,ix=X.focus.indexOf(c),y=scrollY,pb=app.querySelector('.pk-body'),ps=pb?pb.scrollTop:0;
  if(ix>=0)X.focus.splice(ix,1);else X.focus.push(c);
  saveX();render();const nb=app.querySelector('.pk-body');if(nb)nb.scrollTop=ps;scrollTo(0,y)});
 app.querySelectorAll('[data-pkclear]').forEach(b=>b.onclick=()=>{const y=scrollY;X.focus=[];saveX();render();scrollTo(0,y)});
 const ob=app.querySelector('[data-only]');
 if(ob)ob.onclick=()=>{X.only=!X.only;saveX();ob.setAttribute('aria-checked',X.only);const u=app.querySelector('.page ul');if(u)u.classList.toggle('only',X.only)};
 const bs=[...app.querySelectorAll('[data-bk]')];void app.offsetWidth;
 bs.forEach(i=>{const w=+i.dataset.w;if(i.dataset.c){i.style.strokeDashoffset=(+i.dataset.c)*(1-w/100);i.style.opacity=w>0?1:0}else i.style.width=w+'%';LW[i.dataset.bk]=w});
 tickClock();showQuote();

// ---- extras: preferences, flip clock, quotes ----
let P={h24:false,quotes:true};
try{Object.assign(P,JSON.parse(localStorage.getItem('c12prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('c12prefs',JSON.stringify(P))}catch(e){}};

const FD='<div class="fd"><div class="h t"><b></b></div><div class="h u"><b></b></div><div class="h ft"><b></b></div><div class="h fb"><b></b></div></div>';
function setDigit(d,v){const o=d.dataset.v;if(o===v)return;d.dataset.v=v;const q=c=>d.querySelector(c+' b');
 if(o===undefined){d.querySelectorAll('b').forEach(b=>b.textContent=v);return}
 q('.t').textContent=v;q('.u').textContent=o;q('.ft').textContent=o;q('.fb').textContent=v;
 d.classList.remove('go');void d.offsetWidth;d.classList.add('go');
 clearTimeout(d._t);d._t=setTimeout(()=>{q('.u').textContent=v;d.classList.remove('go')},640)}
function tickClock(){const d=new Date();let h=d.getHours(),ap='';const m=String(d.getMinutes()).padStart(2,'0');
 if(!P.h24){ap=h<12?'AM':'PM';h=h%12||12}h=String(h).padStart(2,'0');
 const date=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
 document.querySelectorAll('[data-clock]').forEach(e=>{
  if(e.dataset.clock!=='big'){e.textContent=h+':'+m+(ap?' '+ap:'');return}
  if(!e.firstChild)e.innerHTML=`<div class="flip">${FD+FD}<i class="colon">:</i>${FD+FD}<i class="colon">:</i>${FD+FD}<small class="ap"></small></div><div class="label dt"></div>`;
  const s=h+m+String(d.getSeconds()).padStart(2,'0');e.querySelectorAll('.fd').forEach((x,i)=>setDigit(x,s[i]));
  e.querySelector('.ap').textContent=ap;e.querySelector('.dt').textContent=date})}
(function loop(){tickClock();setTimeout(loop,1000-Date.now()%1000+15)})();

const Q=['One chapter at a time.','Small steps, every day.','Consistency beats intensity.','Future you is watching. Be kind to them.','Focus now, rest later.','Done is better than perfect.','Revise. Practise. Repeat.','Quiet effort adds up.','Start before you feel ready.','37 chapters. One tick at a time.','Progress, not perfection.','Discipline is remembering what you want.'];
let qi=Math.floor(Math.random()*Q.length);
function showQuote(){const e=document.getElementById('quote');if(e)e.textContent=P.quotes?Q[qi]:''}
setInterval(()=>{qi=(qi+1)%Q.length;const e=document.getElementById('quote');if(!e)return;e.style.opacity=0;setTimeout(()=>{showQuote();e.style.opacity=1},500)},20000);

// floating settings panel
const dock=document.getElementById('dock');let panelOpen=false,panelFresh=false;
const chips=(items,cur,a)=>items.map(([k,n])=>`<button class="chip ${cur===k?'on':''}" data-${a}="${k}">${n}</button>`).join('');
function drawDock(){
 const pf=panelFresh;panelFresh=false;
 dock.innerHTML=(panelOpen?`<div class="card panel ${pf?'enter':''}"><p class="label">Clock</p><div class="chips">${chips([['12','12h'],['24','24h']],P.h24?'24':'12','h')}</div>
 <p class="label">Quotes</p><div class="chips"><button class="chip ${P.quotes?'on':''}" data-q="1">${P.quotes?'On':'Off'}</button></div></div>`:'')
 +`<button class="fab" data-fab="1" aria-label="Display settings" aria-expanded="${panelOpen}">${panelOpen?'×':'✦'}</button>`}
dock.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.fab){panelOpen=!panelOpen;panelFresh=panelOpen}
 else if('h' in d){P.h24=d.h==='24';savePrefs();document.querySelectorAll('[data-clock="big"]').forEach(x=>x.innerHTML='');tickClock()}
 else if(d.q){P.quotes=!P.quotes;savePrefs();showQuote()}
 drawDock()};
drawDock();

document.getElementById('sig').innerHTML=[...'ARNAV TIWARI'].map((c,i)=>c===' '?'<span class="sp"></span>':`<span style="animation-delay:${(i*.18).toFixed(2)}s" aria-hidden="true">${c}</span>`).join('');
init();
</script></body></html>
